<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <title>Online Šach</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #222; color: white; }
        #board { width: 400px; margin: 20px auto; }
        #status { font-size: 1.2em; margin: 10px; }
        button { padding: 10px 20px; font-size: 1em; cursor: pointer; }
    </style>
</head>
<body>

    <h1>Online Šach</h1>
    <div id="status">Pripájanie...</div>
    <div id="board"></div>
    <button onclick="copyInviteLink()">Vytvoriť pozvánku pre kamaráta</button>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>

    <script>
        const socket = io();
        const game = new Chess();
        let board = null;
        let myColor = null;

        const urlParams = new URLSearchParams(window.location.search);
        let roomId = urlParams.get('room');

        if (!roomId) {
            roomId = Math.random().toString(36).substring(2, 9);
            window.history.pushState({}, '', '?room=' + roomId);
        }

        socket.emit('joinRoom', roomId);

        socket.on('init', (data) => {
            myColor = data.color;
            if (myColor === 'w') {
                document.getElementById('status').innerText = 'Si BIELY. Čaká sa na druhého hráča...';
            } else if (myColor === 'b') {
                document.getElementById('status').innerText = 'Si ČIERNY. Hra začína!';
            } else {
                document.getElementById('status').innerText = 'Miestnosť je plná (Divák)';
            }
            initBoard();
        });

        socket.on('startGame', () => {
            if (myColor === 'w') {
                document.getElementById('status').innerText = 'Hráč sa pripojil! Si na ťahu (Biely).';
            }
        });

        function onDragStart(source, piece) {
            // Zakážeme ťahať ak je koniec hry, ak nie si na ťahu, alebo ak ťaháš súperovu figúrku
            if (game.game_over()) return false;
            if ((game.turn() === 'w' && myColor !== 'w') || (game.turn() === 'b' && myColor !== 'b')) return false;
            if ((game.turn() === 'w' && piece.search(/^b/) !== -1) || (game.turn() === 'b' && piece.search(/^w/) !== -1)) return false;
        }

        function onDrop(source, target) {
            // Skontrolujeme, či je ťah podľa pravidiel šachu možný
            const move = game.move({
                from: source,
                to: target,
                promotion: 'q'
            });

            if (move === null) return 'snapback'; // Neplatný ťah - figúrka sa vráti

            // Posleme ťah na server druhemu hráčovi
            socket.emit('move', { source, target });
            updateStatus();
        }

        function onSnapEnd() {
            board.position(game.fen());
        }

        socket.on('move', (moveData) => {
            game.move({ from: moveData.source, to: moveData.target, promotion: 'q' });
            board.position(game.fen());
            updateStatus();
        });

        function initBoard() {
            const config = {
                draggable: true,
                position: 'start',
                orientation: myColor === 'b' ? 'black' : 'white',
                onDragStart: onDragStart,
                onDrop: onDrop,
                onSnapEnd: onSnapEnd
            };
            board = Chessboard('board', config);
        }

        function updateStatus() {
            if (game.in_checkmate()) {
                document.getElementById('status').innerText = 'Koniec hry - Šach mat!';
            } else if (game.in_draw()) {
                document.getElementById('status').innerText = 'Koniec hry - Remíza!';
            } else {
                const turnText = game.turn() === 'w' ? 'Biely' : 'Čierny';
                document.getElementById('status').innerText = `Na ťahu je: ${turnText}`;
            }
        }

        function copyInviteLink() {
            navigator.clipboard.writeText(window.location.href);
            alert('Odkaz na hru bol skopírovaný! Pošli ho kamarátovi.');
        }
    </script>
</body>
</html>
