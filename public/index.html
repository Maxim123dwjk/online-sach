<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Šach</title>
    <!-- CSS pre hraciu plochu -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css" integrity="sha256-4YI2ZwR85X4S4Dw+H5rIqZ1qC3X5M7A4N1S5J6vV94=" crossorigin="anonymous">
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            background: #1e1e1e; 
            color: white; 
            margin-top: 20px; 
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        #board { 
            width: 600px; /* Zväčšená šachovnica */
            max-width: 95vw; 
            margin: 20px auto; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        #status { 
            font-size: 1.5em; /* Zväčšený text stavu */
            margin: 15px; 
            font-weight: bold; 
            color: #00d2d3;
        }
        button { 
            padding: 12px 25px; 
            font-size: 1.2em; /* Zväčšené tlačidlo */
            cursor: pointer; 
            background: #28a745; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            margin-top: 10px;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover { 
            background: #218838; 
        }
    </style>
</head>
<body>

    <h1>Online Šach</h1>
    <div id="status">Pripájanie k serveru...</div>
    <div id="board"></div>
    <button onclick="copyInviteLink()">Vytvoriť pozvánku pre kamaráta</button>

    <!-- Knižnice: JQuery, Chessboard.js, Chess.js, Socket.io -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js" integrity="sha256-eT3K0T9J2C4G8H1H/w24A5f2E1I3J4Y0J7N6V34=" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>

    <script>
        const socket = io();
        const game = new Chess();
        let board = null;
        let myColor = null;

        const urlParams = new URLSearchParams(window.location.search);
        let roomId = urlParams.get('room');

        if (!roomId) {
            roomId = Math.random().toString(36).substring(2, 9);
            window.history.pushState({}, '', '?room=' + roomId);
        }

        socket.emit('joinRoom', roomId);

        socket.on('init', (data) => {
            myColor = data.color;
            if (myColor === 'w') {
                document.getElementById('status').innerText = 'Si BIELY. Čaká sa na druhého hráča...';
            } else if (myColor === 'b') {
                document.getElementById('status').innerText = 'Si ČIERNY. Hra začína!';
            } else {
                document.getElementById('status').innerText = 'Miestnosť je plná (Si iba divák)';
            }
            initBoard();
        });

        socket.on('startGame', () => {
            if (myColor === 'w') {
                document.getElementById('status').innerText = 'Hráč sa pripojil! Si na ťahu (Biely).';
            }
        });

        function onDragStart(source, piece) {
            if (game.game_over()) return false;
            if ((game.turn() === 'w' && (myColor !== 'w' || piece.search(/^b/) !== -1)) ||
                (game.turn() === 'b' && (myColor !== 'b' || piece.search(/^w/) !== -1))) {
                return false;
            }
        }

        function onDrop(source, target) {
            const move = game.move({
                from: source,
                to: target,
                promotion: 'q'
            });

            if (move === null) return 'snapback';

            socket.emit('move', { source, target });
            updateStatus();
        }

        function onSnapEnd() {
            board.position(game.fen());
        }

        socket.on('move', (moveData) => {
            game.move({ from: moveData.source, to: moveData.target, promotion: 'q' });
            board.position(game.fen());
            updateStatus();
        });

        function initBoard() {
            const config = {
                draggable: true,
                position: 'start',
                orientation: myColor === 'b' ? 'black' : 'white',
                onDragStart: onDragStart,
                onDrop: onDrop,
                onSnapEnd: onSnapEnd,
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
            };
            board = Chessboard('board', config);
        }

        function updateStatus() {
            let status = '';
            const turnText = game.turn() === 'w' ? 'Biely' : 'Čierny';

            if (game.in_checkmate()) {
                status = `Koniec hry - Šach mat! Vyhral ${game.turn() === 'b' ? 'Biely' : 'Čierny'}.`;
            } else if (game.in_draw()) {
                status = 'Koniec hry - Remíza!';
            } else {
                status = `Na ťahu je: ${turnText}`;
                if (game.in_check()) {
                    status += ' (ŠACH!)';
                }
            }
            document.getElementById('status').innerText = status;
        }

        function copyInviteLink() {
            const el = document.createElement('textarea');
            el.value = window.location.href;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            alert('Odkaz na hru bol skopírovaný! Pošli ho kamarátovi.');
        }
    </script>
</body>
</html>
